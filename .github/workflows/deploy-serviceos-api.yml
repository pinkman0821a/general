name: Deploy ServiceOS API

on:
  push:
    branches:
      - main
    paths:
      - "serviceos/backend/**"
      - ".github/workflows/deploy-serviceos-api.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ServiceOS API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"

      - name: Instalar Python 3.13
        working-directory: serviceos/backend
        run: uv python install 3.13.15

      - name: Preparar dependencias
        working-directory: serviceos/backend
        run: uv sync --python 3.13.15

      - name: Desplegar API en Cloudflare
        working-directory: serviceos/backend
        run: uv run --python 3.13.15 pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}